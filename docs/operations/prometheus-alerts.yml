groups:
  - name: netloom-controller
    rules:
      - alert: NetloomControllerReconcileFailing
        expr: netloom_controller_reconcile_success == 0
        for: 2m
        labels:
          severity: critical
          component: controller
        annotations:
          summary: Netloom controller reconcile is failing
          description: "The controller failed its latest reconcile attempt. Check the phase and error labels on netloom_controller_reconcile_failure."
          runbook_url: docs/operations/runbooks.md

      - alert: NetloomOVNHealthFailing
        expr: netloom_controller_ovn_health_consecutive_failures > 0
        for: 2m
        labels:
          severity: critical
          component: ovn
        annotations:
          summary: OVN Northbound health checks are failing
          description: "The controller reports consecutive OVN health failures. Inspect OVN DB connectivity, leader state, and libovsdb reconnect status."
          runbook_url: docs/operations/runbooks.md

      - alert: NetloomOVNClusterQuorumDegraded
        expr: netloom_controller_ovn_cluster_quorum_status{status!="ok"} == 1
        for: 1m
        labels:
          severity: critical
          component: ovn
        annotations:
          summary: OVN Northbound cluster quorum is degraded
          description: "The controller did not observe an OK OVN cluster quorum state. Inspect endpoint role/status labels and leader probe output."
          runbook_url: docs/operations/runbooks.md

      - alert: NetloomOVNLeaderProbeFailing
        expr: netloom_controller_ovn_cluster_leader_probe_status{status="error"} == 1
        for: 2m
        labels:
          severity: warning
          component: ovn
        annotations:
          summary: OVN leader probing is failing
          description: "The controller cannot determine the OVN Northbound leader. Inspect NETLOOM_OVN_CLUSTER_STATUS_TARGETS, ovn-appctl cluster/status output, and endpoint reachability."
          runbook_url: docs/operations/runbooks.md

      - alert: NetloomOVNEndpointConnectErrors
        expr: netloom_controller_ovn_cluster_connect_error_endpoints > 0
        for: 2m
        labels:
          severity: warning
          component: ovn
        annotations:
          summary: OVN Northbound endpoints have connection errors
          description: "At least one configured OVN Northbound endpoint is failing libovsdb connection attempts. Inspect endpoint status labels, network reachability, and certificates."
          runbook_url: docs/operations/runbooks.md

      - alert: NetloomOVNEndpointCooldownActive
        expr: netloom_controller_ovn_cluster_cooldown_endpoints > 0
        for: 5m
        labels:
          severity: warning
          component: ovn
        annotations:
          summary: OVN Northbound endpoints are in reconnect cooldown
          description: "The controller is temporarily cooling down failed OVN Northbound endpoints. Check next_retry_at in controller status and confirm other endpoints remain reachable."
          runbook_url: docs/operations/runbooks.md

      - alert: NetloomOVNManagedRowsMissing
        expr: netloom_controller_ovn_live_missing_managed_rows > 0
        for: 5m
        labels:
          severity: warning
          component: ovn
        annotations:
          summary: OVN managed rows are missing
          description: "Netloom live audit reports desired OVN rows missing from Northbound DB. Check table labels and reconcile events before manual repair."
          runbook_url: docs/operations/runbooks.md

      - alert: NetloomOVNManagedRowsUnexpected
        expr: netloom_controller_ovn_live_unexpected_managed_rows > 0
        for: 10m
        labels:
          severity: warning
          component: ovn
        annotations:
          summary: Unexpected Netloom-managed OVN rows exist
          description: "Netloom live audit found managed OVN rows that are not in desired state. Confirm cleanup mode and stale-row ownership before deleting."
          runbook_url: docs/operations/runbooks.md

      - alert: NetloomOVNManagedRowsDrifted
        expr: netloom_controller_ovn_live_drifted_managed_rows > 0
        for: 5m
        labels:
          severity: warning
          component: ovn
        annotations:
          summary: OVN managed rows have field drift
          description: "Netloom live audit reports field-level drift on managed OVN rows. Use netloom_controller_ovn_live_drifted_managed_field labels to locate the table and field."
          runbook_url: docs/operations/runbooks.md

      - alert: NetloomOVNStaleAdvisoryActive
        expr: netloom_controller_ovn_stale_advisory_active == 1
        for: 10m
        labels:
          severity: warning
          component: ovn
        annotations:
          summary: OVN stale-object advisory is active
          description: "The controller stale-object burden crossed the configured advisory threshold. Review cleanup counts and scheduled maintenance."
          runbook_url: docs/operations/runbooks.md

      - alert: NetloomOVNMaintenanceFailing
        expr: netloom_controller_ovn_maintenance_failed > 0
        for: 5m
        labels:
          severity: warning
          component: ovn
        annotations:
          summary: OVN maintenance hook is failing
          description: "The controller reports failed OVN maintenance actions such as compaction or stale-state hooks. Inspect maintenance error labels and controller events before retrying."
          runbook_url: docs/operations/runbooks.md

  - name: netloom-agent
    rules:
      - alert: NetloomAgentRuntimePreflightFailing
        expr: netloom_agent_runtime_failed_checks > 0
        for: 1m
        labels:
          severity: critical
          component: agent
        annotations:
          summary: Netloom agent runtime preflight is failing
          description: "The agent reports failed runtime checks. Inspect bpffs, memlock, BPF capability, NET_ADMIN, OVSDB, and OVN endpoint checks before enabling strict mutation."
          runbook_url: docs/operations/runbooks.md

      - alert: NetloomTCXAttachFailing
        expr: netloom_agent_tcx_failed > 0
        for: 1m
        labels:
          severity: critical
          component: ebpf
        annotations:
          summary: TCX policy attachment is failing
          description: "The agent failed to attach or update TCX policy on at least one target. Inspect the target label and agent status last error."
          runbook_url: docs/operations/runbooks.md

      - alert: NetloomPolicyMapPressureCritical
        expr: netloom_agent_policy_endpoint_pressure_severity{severity="critical"} == 1
        for: 2m
        labels:
          severity: critical
          component: ebpf
        annotations:
          summary: Endpoint policy map pressure is critical
          description: "An endpoint policy map reached critical pressure. Use recommended-capacity and hotspot metrics before the next rollout."
          runbook_url: docs/operations/runbooks.md

      - alert: NetloomPolicyMapCapacityExceeded
        expr: netloom_agent_policy_endpoint_last_event_failure_reason{reason="capacity_exceeded"} == 1
        for: 1m
        labels:
          severity: critical
          component: ebpf
        annotations:
          summary: Endpoint policy update exceeded map capacity
          description: "The latest endpoint policy update failed because the policy map did not have enough capacity. Increase capacity or reduce rule expansion."
          runbook_url: docs/operations/runbooks.md

      - alert: NetloomPolicyCanonicalizationFailed
        expr: netloom_agent_policy_endpoint_last_event_failure_reason{reason="canonicalization_failed"} == 1
        for: 1m
        labels:
          severity: warning
          component: policy
        annotations:
          summary: Endpoint policy canonicalization failed
          description: "The latest endpoint policy update failed before programming. Inspect policy events for rule refs, direction, action, and canonicalization error."
          runbook_url: docs/operations/runbooks.md

      - alert: NetloomPolicyApplyFailed
        expr: netloom_agent_policy_endpoint_last_event_failure_reason{reason="apply_failed"} == 1
        for: 1m
        labels:
          severity: critical
          component: ebpf
        annotations:
          summary: Endpoint policy apply failed
          description: "The latest endpoint policy update failed while applying eBPF policy state. Inspect policy events, bpffs, pinned maps, and TCX state."
          runbook_url: docs/operations/runbooks.md

      - alert: NetloomPolicyActionHistoryFailures
        expr: netloom_agent_policy_action_history_failure_events > 0
        for: 5m
        labels:
          severity: warning
          component: policy
        annotations:
          summary: Endpoint policy lifecycle actions are failing
          description: "The agent recorded failed endpoint lifecycle actions such as regenerate, quarantine, rollback, freeze, or unfreeze. Inspect action history by endpoint, action, and reason."
          runbook_url: docs/operations/runbooks.md

      - alert: NetloomPolicyEndpointActionFailed
        expr: netloom_agent_policy_action_history_endpoint_last_success == 0
        for: 1m
        labels:
          severity: critical
          component: policy
        annotations:
          summary: Latest endpoint policy lifecycle action failed
          description: "The latest lifecycle action for an endpoint failed. Use policy-action-history to identify the endpoint, action, stable failure reason, and error."
          runbook_url: docs/operations/runbooks.md

      - alert: NetloomPolicyEndpointActionFrozen
        expr: netloom_agent_policy_action_history_endpoint_last_reason{reason="frozen"} == 1
        for: 5m
        labels:
          severity: warning
          component: policy
        annotations:
          summary: Endpoint policy lifecycle action is blocked by freeze
          description: "An endpoint lifecycle action was rejected because the endpoint is frozen. Confirm the freeze state and expiry before retrying rollout, regenerate, quarantine, or rollback."
          runbook_url: docs/operations/runbooks.md

      - alert: NetloomPolicyRolloutFailed
        expr: netloom_agent_policy_rollout_failed_endpoints > 0
        for: 1m
        labels:
          severity: critical
          component: rollout
        annotations:
          summary: Policy rollout has failed endpoints
          description: "The latest policy rollout failed for one or more endpoints. Inspect rollout history, policy events, and failed endpoint phases before retrying."
          runbook_url: docs/operations/runbooks.md

      - alert: NetloomPolicyRolloutRollbackFailed
        expr: netloom_agent_policy_rollout_rollback_failed_endpoints > 0
        for: 1m
        labels:
          severity: critical
          component: rollout
        annotations:
          summary: Policy rollout rollback failed
          description: "A policy rollout rollback failed for at least one endpoint. Inspect live policy entries and restore the desired endpoint policy before continuing rollout."
          runbook_url: docs/operations/runbooks.md

      - alert: NetloomPolicyRolloutPaused
        expr: netloom_agent_policy_rollout_paused > 0
        for: 15m
        labels:
          severity: warning
          component: rollout
        annotations:
          summary: Policy rollout is paused
          description: "A rollout is paused due to operator control, approval, acknowledgement, risk gate, finalize gate, batch pause, or promotion limit."
          runbook_url: docs/operations/runbooks.md

      - alert: NetloomPolicyRolloutStateLoadFailing
        expr: netloom_agent_policy_rollout_state_load_error == 1
        for: 2m
        labels:
          severity: critical
          component: rollout
        annotations:
          summary: Durable policy rollout state cannot be loaded
          description: "The agent could not load durable rollout state from OVSDB. Reconcile may lose paused or failed rollout context until the store is readable."
          runbook_url: docs/operations/runbooks.md

      - alert: NetloomPolicyRolloutStateFailedEndpoints
        expr: netloom_agent_policy_rollout_state_failed_endpoints > 0
        for: 5m
        labels:
          severity: critical
          component: rollout
        annotations:
          summary: Durable policy rollout state contains failed endpoints
          description: "Persisted rollout state contains failed endpoints. Review rollout state and history before resuming or clearing the rollout."
          runbook_url: docs/operations/runbooks.md

      - alert: NetloomPolicyRolloutStatePaused
        expr: netloom_agent_policy_rollout_state_paused_rollouts > 0
        for: 15m
        labels:
          severity: warning
          component: rollout
        annotations:
          summary: Durable policy rollout state has paused rollouts
          description: "One or more persisted desired-state rollouts are paused. Confirm whether the pause is expected before making more policy changes."
          runbook_url: docs/operations/runbooks.md

      - alert: NetloomProviderNetworkDegraded
        expr: netloom_agent_provider_network_ready == 0
        for: 2m
        labels:
          severity: critical
          component: provider-network
        annotations:
          summary: Provider network is not ready
          description: "A provider network is not ready. Check parent link readiness, bridge mapping, OVSDB row drift, QoS, Queue, and controller status labels."
          runbook_url: docs/operations/runbooks.md

      - alert: NetloomProviderNetworkIssueReported
        expr: netloom_agent_provider_network_issue_reason == 1
        for: 5m
        labels:
          severity: warning
          component: provider-network
        annotations:
          summary: Provider network issue reason is active
          description: "The agent reports a stable provider issue reason such as parent-down, link-drift, ovsdb-port-drift, ovsdb-interface-drift, qos-mismatch, or controller drift."
          runbook_url: docs/operations/runbooks.md
